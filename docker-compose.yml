services:
  postgres:
    image: postgres:16-alpine
    container_name: razorrecon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: razorrecon
      POSTGRES_PASSWORD: razorrecon
      POSTGRES_DB: razorrecon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - razorrecon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U razorrecon -d razorrecon"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: razorrecon_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - razorrecon-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  razorrecon-net:
    driver: bridge

volumes:
  postgres_data:
