# ─────────────────────────────────────────────────────────────────────────────
# RazorRecon AI — Production Docker Compose
#
# Usage:
#   docker-compose -f docker-compose.prod.yml up --build -d
#
# Before first run:
#   1. Copy .env.example → backend/.env and fill in all values
#   2. Generate SSL certs: see nginx/README.md or use Let's Encrypt
#   3. For cloud: point DATABASE_URL / REDIS_URL at managed services
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: razorrecon_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-razorrecon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-razorrecon_prod_secret}
      POSTGRES_DB: ${POSTGRES_DB:-razorrecon}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - razorrecon-prod-net
    # Not exposed externally in production — backend connects via internal network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-razorrecon} -d ${POSTGRES_DB:-razorrecon}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: razorrecon_redis_prod
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-razorrecon_redis_secret}", "--appendonly", "yes"]
    volumes:
      - redis_prod_data:/data
    networks:
      - razorrecon-prod-net
    # Not exposed externally — backend connects via internal network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-razorrecon_redis_secret}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── FastAPI Backend (Gunicorn + UvicornWorker) ──────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: razorrecon_backend_prod
    restart: always
    env_file:
      - backend/.env
    environment:
      # Override DATABASE_URL to use the internal postgres container
      - DATABASE_URL=postgresql://${POSTGRES_USER:-razorrecon}:${POSTGRES_PASSWORD:-razorrecon_prod_secret}@postgres:5432/${POSTGRES_DB:-razorrecon}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-razorrecon_redis_secret}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - razorrecon-prod-net
    # Internal only — Nginx proxies externally
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Nginx Reverse Proxy + TLS ───────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: razorrecon_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Optional: serve pre-built React frontend
      # - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - razorrecon-prod-net
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

# ── Networks ────────────────────────────────────────────────────────────────────
networks:
  razorrecon-prod-net:
    driver: bridge

# ── Volumes ─────────────────────────────────────────────────────────────────────
volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
