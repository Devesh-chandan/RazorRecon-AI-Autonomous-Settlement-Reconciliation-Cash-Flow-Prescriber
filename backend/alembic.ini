[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os  # Use os.pathsep

# Loaded from .env via python-dotenv in env.py
sqlalchemy.url = postgresql://razorrecon:razorrecon@localhost:5432/razorrecon

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
